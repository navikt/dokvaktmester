name: sett_avbrutt_brev_redigerbart.yml

on:
  workflow_dispatch:
    inputs:
      journalpostId:
        description: "JournalpostId til brevet som skal settes redigerbart"
        required: true
        type: string

jobs:
  build_and_deploy:
    name: Build, push and deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Build and push image and SBOM to OCI registry
        uses: nais/docker-build-push@v0
        id: docker-build-push
        with:
          team: teamdokumenthandtering
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}
      - name: Deploy to NAIS
        uses: nais/deploy/actions/deploy@v2
        env:
          CLUSTER: dev-fss
          RESOURCE: .nais/job.yaml
          VARS: .nais/q4-config.json
          VAR: image=${{ steps.docker-build-push.outputs.image }},operasjon=kall_dokprod.sh,input=settAvbruttJournalpostRedigerbar/${{ github.event.inputs.journalpostId }}
          TELEMETRY: ${{ steps.docker-build-push.outputs.telemetry }}
          DEPLOY_SERVER: deploy.nav.cloud.nais.io:443
